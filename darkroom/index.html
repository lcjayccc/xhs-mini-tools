<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>暗房冲印店</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: #0f0706; color: #f0dfd5;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      overflow: hidden;
    }
    .app { position: relative; height: 100%; display: -webkit-box; display: flex; -webkit-box-orient: vertical; flex-direction: column; }
    .intro-title { font-family: "Songti SC", "STSong", "SimSun", serif; font-size: 30px; letter-spacing: 5px; color: #f6e9e0; }
    .intro-sub { margin-top: 8px; font-size: 13px; line-height: 1.65; color: #b9978a; }
  </style>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="app" id="app">
    <div class="safelight" id="safelight" aria-hidden="true">
      <div class="safelight-lamp"></div>
    </div>
    <div class="light-flash" id="light-flash" aria-hidden="true"></div>

    <!-- 首屏：JS 未运行时也能看懂这是什么 -->
    <section class="screen screen-intro" id="screen-intro">
      <header class="topbar" id="topbar">
        <div class="brand-badge">
          <span class="lamp-dot" aria-hidden="true"></span>
          <span class="brand-code">DARKROOM LAB · 35MM</span>
        </div>
        <h1 class="intro-title">暗房冲印店</h1>
        <p class="intro-sub">选一张照片，在红灯下亲手冲洗出来。<br />晃得好不好，决定它最后长什么样。</p>
      </header>

      <div class="intro-tray" aria-hidden="true">
        <div class="tray tray-static">
          <div class="tray-rim"></div>
          <div class="tray-paper">
            <span class="tray-paper-tag">SAMPLE · 00</span>
            <canvas id="sample-preview" width="300" height="400"></canvas>
          </div>
          <div class="tray-liquid"></div>
        </div>
      </div>

      <div class="intro-actions">
        <label class="btn btn-primary" id="pick-label" for="pick-input">
          <svg class="btn-ico" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
            <rect x="2" y="5" width="16" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/>
            <path d="M6.5 5L8 3h4l1.5 2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
            <circle cx="10" cy="11" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/>
          </svg>
          <span>选一张照片</span>
        </label>
        <input type="file" id="pick-input" accept="image/*" class="visually-hidden" />
        <button type="button" class="btn btn-ghost" id="use-sample" disabled>先用示例底片试试</button>
        <p class="status" id="intro-status" role="status">正在点亮红灯…若长时间没有反应，请退出后重新打开。</p>
      </div>
    </section>

    <!-- 显影 -->
    <section class="screen screen-develop" id="screen-develop" hidden>
      <header class="topbar">
        <ol class="steps" aria-label="冲洗步骤">
          <li class="is-on"><span class="step-num">01</span>显影</li>
          <li><span class="step-num">02</span>定影</li>
          <li><span class="step-num">03</span>开灯</li>
        </ol>
      </header>
      <div class="stage">
        <span class="tray-badge" aria-hidden="true">DEV · 显影液</span>
        <div class="tray" id="tray">
          <div class="tray-rim"></div>
          <div class="tray-paper" id="tray-paper"><canvas id="develop-canvas"></canvas></div>
          <div class="tray-liquid" id="tray-liquid"></div>
          <div class="tray-ripples" id="tray-ripples" aria-hidden="true"></div>
          <div class="tray-red" aria-hidden="true"></div>
        </div>
      </div>
      <div class="panel">
        <div class="readout-box">
          <div class="readout">
            <div class="readout-clock">
              <span class="clock-dot" aria-hidden="true"></span>
              <span class="readout-time" id="dev-time">00:00</span>
            </div>
            <div class="readout-flow">
              <span class="readout-label">药水流动</span>
              <span class="meter"><span class="meter-fill" id="dev-meter"></span></span>
            </div>
          </div>
        </div>
        <p class="hint" id="dev-hint">晃一晃手机，让药水流过相纸</p>
        <button type="button" class="btn btn-primary" id="pull-out" disabled>捞出来</button>
      </div>
    </section>

    <!-- 定影 -->
    <section class="screen screen-fix" id="screen-fix" hidden>
      <header class="topbar">
        <ol class="steps" aria-label="冲洗步骤">
          <li class="is-done"><span class="step-num">01</span>显影</li>
          <li class="is-on" id="step-fix"><span class="step-num">02</span>定影</li>
          <li id="step-light"><span class="step-num">03</span>开灯</li>
        </ol>
      </header>
      <div class="stage">
        <span class="tray-badge" aria-hidden="true">FIX · 定影液</span>
        <div class="tray tray-fix">
          <div class="tray-rim"></div>
          <div class="tray-paper"><canvas id="fix-canvas"></canvas></div>
          <div class="tray-liquid tray-liquid-calm"></div>
          <div class="tray-red" aria-hidden="true"></div>
        </div>
      </div>
      <div class="panel panel-fix">
        <p class="hint" id="fix-hint">按住不放，让定影液把画面固定下来</p>
        <div class="fix-actions">
          <button type="button" class="btn btn-hold" id="fix-hold">
            <span class="hold-fill" id="fix-fill"></span>
            <span class="hold-inner">
              <svg class="btn-ico hold-ico" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
                <circle cx="10" cy="10" r="7.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="3 2"/>
                <circle cx="10" cy="10" r="3.2" fill="currentColor"/>
              </svg>
              <span class="hold-text" id="fix-text">按住定影</span>
            </span>
          </button>
          <button type="button" class="btn btn-ghost" id="lights-on" hidden>开灯看看</button>
        </div>
      </div>
    </section>

    <!-- 出片 -->
    <section class="screen screen-result" id="screen-result" hidden>
      <div class="result-scroll">
        <div class="result-inner">
          <div class="result-stage">
            <div class="result-card"><img id="result-img" alt="冲洗出来的照片" /></div>
          </div>
          <div class="result-meta">
            <p class="result-kicker">冲印质检单</p>
            <p class="result-title visually-hidden" id="result-title">刚刚好的一张</p>
            <div class="result-report" id="result-report"></div>
          </div>
          <div class="result-actions">
            <div class="result-btn-row">
              <button type="button" class="btn btn-primary" id="save-photo">
                <svg class="btn-ico" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
                  <path d="M10 3v9m0 0l-3.5-3.5M10 12l3.5-3.5M4 15.5h12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>存到相册</span>
              </button>
              <button type="button" class="btn btn-ghost" id="post-note">
                <svg class="btn-ico" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
                  <path d="M4 16h12M6 12.5l7.5-7.5 2 2L8 14.5 5.5 15 6 12.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>发一篇笔记</span>
              </button>
            </div>
            <button type="button" class="btn btn-text" id="again">再冲一张</button>
            <p class="status" id="result-status" role="status"></p>
          </div>
        </div>
      </div>
    </section>
  </div>

  <canvas id="work-canvas" class="visually-hidden" aria-hidden="true"></canvas>
  <script defer src="./bridge.js"></script>
  <script defer src="./film.js"></script>
  <script defer src="./app.js"></script>
</body>
</html>
